name: release-aur

# Pushes a fresh `argos-bin` PKGBUILD to the AUR when a release is
# *published* (not draft). Fires on the GitHub `release: published`
# event so AUR users never see a PKGBUILD pointing at a 404 download.
#
# Required secrets:
#   - AUR_SSH_PRIVATE_KEY    — SSH key registered on aur.archlinux.org
#   - AUR_USERNAME / AUR_EMAIL — git author for the AUR commit

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.4)"
        required: true

permissions:
  contents: read

jobs:
  aur:
    name: Publish argos-bin to AUR
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Render PKGBUILD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p out
          gh release download "$TAG" --pattern "Argos_${VERSION}_amd64.AppImage" --dir out
          SHA=$(sha256sum "out/Argos_${VERSION}_amd64.AppImage" | cut -d' ' -f1)
          sed -e "s/@PKGVER@/${VERSION}/g" \
              -e "s/@SHA256@/${SHA}/g" \
              packaging/aur/argos-bin/PKGBUILD.template > out/PKGBUILD
          cat out/PKGBUILD
      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: argos-bin
          pkgbuild: out/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "argos-bin ${{ github.event.release.tag_name || github.event.inputs.tag }}"
          updpkgsums: false
          test: false
