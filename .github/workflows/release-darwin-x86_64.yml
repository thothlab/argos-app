name: release (darwin-x86_64)

# Intel Mac build hoisted out of the main release workflow because
# GitHub-hosted macos-13 runners regularly sit in the queue for hours
# and block manifest assembly. Run manually when an Intel Mac asset
# is actually needed for a given tag.
#
# Usage: Actions → release (darwin-x86_64) → Run workflow → enter the
# release tag (e.g. `v0.1.3`). The job appends an Intel Mac bundle +
# signature to the existing release and re-merges `latest.json` so
# `make push-manifest` picks up the new platform entry.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build for (e.g. v0.1.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build (darwin-x86_64)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build UI
        run: pnpm --filter @argos/ui build

      - name: Build + sign Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/desktop/src-tauri
          tagName: ${{ inputs.tag }}
          releaseName: "Argos ${{ inputs.tag }}"
          releaseDraft: false
          prerelease: false
          args: --target x86_64-apple-darwin

  manifest:
    name: re-assemble latest.json
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Merge darwin-x86_64 into latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --pattern '*.json' --dir dist
          python3 .github/scripts/merge-tauri-manifests.py dist > latest.json
          gh release upload "$TAG" latest.json --clobber
          echo
          echo "Manifest re-assembled with darwin-x86_64. On the Mac Mini run:"
          echo "  cd apps/web"
          echo "  gh release download $TAG --pattern latest.json"
          echo "  make push-manifest FILE=./latest.json"
